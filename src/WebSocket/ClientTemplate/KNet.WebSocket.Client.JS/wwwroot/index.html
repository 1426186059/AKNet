<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <title>KNet.WebSocket.Client.JS 性能测试</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type='module' src="main#[.{fingerprint}].js"></script>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 16px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #569cd6; }
    .row { margin: 8px 0; }
    label { display: inline-block; width: 80px; }
    input { background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; padding: 4px 8px; }
    button { background: #0e639c; color: #fff; border: none; padding: 6px 14px; cursor: pointer; margin-right: 6px; }
    button:hover { background: #1177bb; }
    .stat { background: #2d2d2d; padding: 6px 12px; display: inline-block; margin-right: 12px; border-radius: 4px; }
    .stat b { color: #4ec9b0; }
    #log { background: #000; color: #b5cea8; padding: 8px; height: 220px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; border: 1px solid #444; }
    select { background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; padding: 4px; }
  </style>
</head>

<body>
  <h1>KNet 浏览器 WebSocket 客户端 · 性能测试</h1>

  <div class="row">
    <label>版本:</label>
    <select id="version">
      <option value="2">V2 — C# 厚封装（JS 仅 WebSocket）</option>
      <option value="1">V1 — JS 厚封装（完整 KNet 在 JS）</option>
    </select>
    <button id="applyVersion">应用版本</button>
  </div>

  <div class="row">
    <label>Host:</label>
    <input id="host" value="127.0.0.1" />
    <label>Port:</label>
    <input id="port" value="9000" style="width:80px" />
    <button id="connect">连接</button>
    <button id="disconnect">断开</button>
  </div>

  <div class="row">
    <label>突发发送:</label>
    <input id="count" value="1000" style="width:80px" /> 包 x
    <input id="bodySize" value="64" style="width:80px" /> 字节
    <button id="burst">发送</button>
    <button id="clearLog">清空日志</button>
  </div>

  <div class="row">
    <label>高并发:</label>
    <input id="clientCount" value="100" style="width:60px" /> 连接 ×
    <input id="perClient" value="10000" style="width:80px" /> 包
    <button id="stress">压测</button>
    <button id="stopStress">停止</button>
  </div>

  <div class="row">
    <span class="stat">状态: <b id="state">未连接</b></span>
    <span class="stat">发送: <b id="sent">0</b></span>
    <span class="stat">接收: <b id="recv">0</b></span>
    <span class="stat">运行: <b id="uptime">00:00:00</b></span>
  </div>

  <div id="log"></div>

  <script>
    // 等待 main.js 暴露 window.perfPanel 后绑定 UI（直接指向 C# [JSExport] 面板，避免脆弱的命名空间回退）
    const bindUI = () => {
      const panel = window.perfPanel;
      if (!panel) {
        if (window.knetExports === undefined) { setTimeout(bindUI, 100); return; }
        // main.js 已执行但没找到面板：给出可见提示，避免“点了没反应”却无任何线索
        const log = document.getElementById('log');
        if (log) { const p = document.createElement('div'); p.style.color = '#f48771'; p.textContent = '[UI] 未找到 PerfPanel 导出，按钮不可用，请查看控制台 [main] 日志'; log.appendChild(p); }
        return;
      }

      const call = (name, ...args) => {
        try {
          const fn = panel[name];
          if (typeof fn !== 'function') { console.error('[UI] 未找到方法: ' + name); return; }
          const r = fn(...args);
          // [JSExport] void 方法从 JS 调用会返回 Promise，捕获异步异常便于排查
          if (r && typeof r.then === 'function') r.catch(err => console.error('[UI] ' + name + ' 异步异常', err));
        } catch (err) { console.error('[UI] ' + name + ' 调用异常', err); }
      };

      document.getElementById('applyVersion').onclick = () =>
        call('SetVersion', parseInt(document.getElementById('version').value, 10));
      document.getElementById('connect').onclick = () =>
        call('Connect', document.getElementById('host').value, document.getElementById('port').value);
      document.getElementById('disconnect').onclick = () => call('Disconnect');
      document.getElementById('burst').onclick = () =>
        call('BurstSend', parseInt(document.getElementById('count').value, 10), parseInt(document.getElementById('bodySize').value, 10));
      document.getElementById('clearLog').onclick = () => call('ClearLog');
      document.getElementById('stress').onclick = () =>
        call('StressTest', parseInt(document.getElementById('clientCount').value, 10), parseInt(document.getElementById('perClient').value, 10));
      document.getElementById('stopStress').onclick = () => call('StopStress');
    };
    bindUI();
  </script>
</body>

</html>
